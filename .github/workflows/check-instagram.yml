name: Controlla Instagram

# Controlla nuovi post Instagram e nuovi articoli sui siti WordPress e,
# se ce ne sono, l'endpoint manda la notifica push.
#
# Il controllo principale è su cron-job.org (ogni 5 minuti, puntuale).
# Questo resta di riserva: GitHub ritarda spesso i cron e li disattiva dopo
# 60 giorni senza commit. Gira ai minuti 7 e 37 per non coincidere mai con
# cron-job.org (due controlli simultanei potrebbero notificare due volte).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nuovi post Instagram
        run: |
          curl -sS --fail-with-body -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://norma2.vercel.app/api/controlla-instagram"

      - name: Nuovi articoli
        if: always()
        run: |
          curl -sS --fail-with-body -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://norma2.vercel.app/api/controlla-articoli"
